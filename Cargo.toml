[package]
name = "n8nc"
version = "0.5.3"
edition = "2024"
rust-version = "1.90"
description = "CLI for n8n workflow automation"
license = "MIT"
repository = "https://github.com/rvben/n8nc"
homepage = "https://github.com/rvben/n8nc"
keywords = ["n8n", "workflow", "automation", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"
exclude = ["docs/superpowers/", ".github/"]

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6.9"
owo-colors = "4"
keyring = "3.6.3"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
similar = "2.7.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
toml = "0.8.23"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48", features = ["json", "redactions"] }
jsonschema = { version = "0.29", default-features = false }
tempfile = "3.27.0"
wiremock = "0.6.5"
